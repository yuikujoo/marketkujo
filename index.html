<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kujo Market</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Squada+One&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
body {
  background: #f5f7fb;
}

.logo-font {
  font-family: 'Squada One', sans-serif;
}

.ui-font {
  font-family: 'Poppins', sans-serif;
}

/* HAMBURGER */
.hamburger span {
  display: block;
  width: 25px;
  height: 3px;
  background: black;
  margin: 5px 0;
  transition: 0.3s;
}

/* MENU FLOATING STYLE */
#sideMenu {
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="bg-white p-4 flex justify-between items-center shadow relative z-30">

  <div class="flex items-center gap-2">
    <img src="https://i.supaimg.com/23b223c0-a5cc-4eb9-a50a-df79dbf49f6a/648f5603-42e2-4083-a95a-7ff4d9dd263e.png" class="w-8 h-8 rounded-md">
    <h1 class="text-xl logo-font">Kujo Market</h1>
  </div>

  <div onclick="openMenu()" class="hamburger cursor-pointer">
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>

<!-- OVERLAY -->
<div id="overlay" onclick="closeMenu()" class="fixed inset-0 bg-black/30 hidden z-40"></div>

<!-- FLOATING MENU -->
<div id="sideMenu"
class="fixed top-16 right-4 w-64 bg-white z-50 p-5 transition-all duration-300 rounded-2xl opacity-0 scale-95">

  <!-- CLOSE -->
  <div class="flex justify-end">
    <button onclick="closeMenu()" class="text-2xl mb-2">✕</button>
  </div>

  <!-- MENU -->
  <div class="space-y-4 ui-font text-lg">

    <div onclick="location.href='index.html'" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-100 cursor-pointer">
      🏠 Home
    </div>

    <div onclick="location.href='topup.html'" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-100 cursor-pointer">
      💰 Top Up
    </div>

    <div onclick="location.href='riwayat.html'" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-100 cursor-pointer">
      📄 Riwayat
    </div>

    <div onclick="location.href='kontak.html'" class="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-100 cursor-pointer">
      📞 Kontak
    </div>

  </div>

</div>

<!-- SCRIPT -->
<script>
function openMenu() {
  const menu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");

  overlay.classList.remove("hidden");

  setTimeout(() => {
    menu.classList.remove("opacity-0","scale-95");
    menu.classList.add("opacity-100","scale-100");
  }, 10);
}

function closeMenu() {
  const menu = document.getElementById("sideMenu");
  const overlay = document.getElementById("overlay");

  menu.classList.add("opacity-0","scale-95");

  setTimeout(() => {
    overlay.classList.add("hidden");
  }, 200);
}
</script>

</body>
</html>
