<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kujo Market - Exclusive Top Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Squada+One&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* CSS tetap sama agar tampilan tidak berubah */
        .overflow-x-auto::-webkit-scrollbar { display:none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body { background-color: #050505; color: #f0f0f0; overflow-x: hidden; width: 100%; }
        .bg-dark-card { background: rgba(18, 18, 18, 0.98); }
        .logo-font { font-family:'Squada One',sans-serif; letter-spacing:1px; display: flex; gap: 1px; }
        .logo-font span { display: inline-block; opacity: 0; transform: translateY(15px); animation: letterAnim 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; background: #ffffff; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes letterAnim { to { opacity: 1; transform: translateY(0); } }
        .ui-font { font-family:'Poppins',sans-serif; }
        .slider-container { position: relative; width: 100vw; height: 180px; display: flex; align-items: center; overflow: visible; }
        .slide-wrapper { display: flex; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }
        .banner-card { min-width: 75vw; height: 140px; margin: 0 10px; border-radius: 16px; overflow: hidden; transition: all 0.5s ease; transform: scale(0.8); opacity: 0.4; }
        .banner-card.active { transform: scale(1.05); opacity: 1; box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); }
        .banner-card img { width: 100%; height: 100%; object-fit: cover; }
        .card-hover { transition: all .4s cubic-bezier(0.165, 0.84, 0.44, 1); border: 1px solid rgba(255, 255, 255, 0.05); }
        .card-hover:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.4); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-item { animation: slideUp 0.5s ease forwards; }
        .badge { position: relative; background: linear-gradient(135deg, #bf953f, #fcf6ba, #aa771c); background-size: 200% 200%; animation: gradientMove 3s linear infinite; box-shadow: 0 0 12px rgba(191, 149, 63, 0.7); overflow: hidden; color: #000; font-weight: 800; border-radius: 4px; }
        .category-btn { background: #151515; color: #777; font-size: 11px; padding: 8px 16px; border-radius: 999px; border: 1px solid #222; white-space: nowrap; }
        .active-cat { background: #ffffff; color: #000; border-color: #ffffff; }
        .overlay { background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 70%, transparent 100%); }
    </style>
</head>
<body class="ui-font">

<div class="bg-dark-card p-4 px-6 flex justify-between items-center sticky top-0 z-50 border-b border-white/5">
    <div class="flex items-center gap-3">
        <img src="https://i.supaimg.com/23b223c0-a5cc-4eb9-a50a-df79dbf49f6a/55af5214-850d-4391-8cb1-807fc897e444.png" class="w-8 h-8 rounded-lg">
        <h1 class="text-xl logo-font" id="animated-logo">
            </h1>
    </div>
    <button onclick="toggleMenu()" class="text-2xl text-white">☰</button>
    <div id="menu" class="hidden absolute right-4 top-16 bg-[#111] border border-white/10 rounded-2xl w-44 p-2 shadow-3xl z-50 backdrop-blur-xl">
        <a href="index.html" class="block px-4 py-2 rounded-xl hover:bg-white/5 transition">Kontak Cs ☎️</a>
    </div>
</div>

<div class="slider-container mt-4">
    <div id="slide-wrapper" class="slide-wrapper">
        </div>
</div>

<div class="flex gap-2 px-4 py-2 mt-2 overflow-x-auto no-scrollbar">
    <button onclick="filterItems('all', this)" class="category-btn active-cat">Populer</button>
    <button onclick="filterItems('game', this)" class="category-btn">Games</button>
    <button onclick="filterItems('pulsa', this)" class="category-btn">Pulsa</button>
    <button onclick="filterItems('ewallet', this)" class="category-btn">E-Wallet</button>
    <button onclick="goAccountGame()" class="category-btn">Account</button>
</div>

<h2 class="px-5 mt-6 mb-4 text-sm font-bold flex items-center gap-2">
    <span id="title-text" class="text-white uppercase tracking-widest">Populer</span>
    <div class="h-[1px] flex-1 bg-white/10 ml-2"></div>
</h2>

<div id="items-grid" class="grid grid-cols-3 gap-3 p-4 pb-20">
    </div>

<script src="banner.js"></script>
<script src="game.js"></script>
<script src="pulsa.js"></script>
<script src="ewallet.js"></script>

<script>
// Fungsi utama untuk menggabungkan semua data dan menjalankan fitur
function renderAll() {
    const grid = document.getElementById('items-grid');
    grid.innerHTML = ''; // Clear grid

    // Gabungkan data dari file JS yang berbeda
    const allProducts = [...gameData, ...pulsaData, ...ewalletData];
    
    allProducts.forEach(item => {
        const itemHtml = `
            <a href="${item.link}" class="game-item animate-item" data-category="${item.category}">
                <div class="rounded-2xl overflow-hidden relative card-hover bg-[#111] aspect-[3/4]">
                    <span class="absolute top-2 left-2 z-10 badge text-[8px] px-1.5 py-0.5">${item.badge}</span>
                    <img src="${item.img}" class="w-full h-full object-cover opacity-80" alt="${item.name}">
                    <div class="absolute bottom-0 w-full overlay p-2 text-white text-[10px] font-medium">${item.name}</div>
                </div>
            </a>
        `;
        grid.insertAdjacentHTML('beforeend', itemHtml);
    });

    // Jalankan filter default
    filterItems('all', document.querySelector('.category-btn'));
}

// Global UI Logic
function toggleMenu() { document.getElementById("menu").classList.toggle("hidden"); }
function goAccountGame(){ window.location.href = "list.html"; }

function filterItems(category, el) {
    document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active-cat'));
    el.classList.add('active-cat');
    const titleText = document.getElementById("title-text");
    const items = document.querySelectorAll('.game-item');
    let count = 0;

    items.forEach(item => {
        item.classList.remove('animate-item');
        void item.offsetWidth;
        item.classList.add('animate-item');

        if (category === 'all') {
            titleText.innerText = "Populer";
            if (count < 6) { item.style.display = 'block'; count++; } 
            else { item.style.display = 'none'; }
        } else {
            titleText.innerText = category.toUpperCase();
            if (item.getAttribute('data-category') === category) { item.style.display = 'block'; } 
            else { item.style.display = 'none'; }
        }
    });
}

// Inisialisasi Logo
const logoContainer = document.getElementById('animated-logo');
"Kujo Market".split("").forEach((char, i) => {
    const span = document.createElement('span');
    span.innerHTML = char === " " ? "&nbsp;" : char;
    span.style.animationDelay = `${0.1 + (i * 0.05)}s`;
    logoContainer.appendChild(span);
});

window.onload = renderAll;
</script>
</body>
</html>
