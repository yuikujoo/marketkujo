<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Up Game</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Squada+One&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
.overflow-x-auto::-webkit-scrollbar {
  display: none;
}

/* LOGO */
.logo-font {
  font-family: 'Squada One', sans-serif;
  letter-spacing: 1px;
}

/* UI TEXT (kategori + judul) */
.ui-font {
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
}
</style>

</head>

<body class="bg-gray-100 font-sans">

<!-- HEADER -->
<div class="bg-white p-4 flex justify-between items-center shadow relative">

  <div class="flex items-center gap-2">
    <img src="https://i.supaimg.com/23b223c0-a5cc-4eb9-a50a-df79dbf49f6a/648f5603-42e2-4083-a95a-7ff4d9dd263e.png" class="w-8 h-8 rounded-md">
    <h1 class="text-xl logo-font">Kujo Market</h1>
  </div>

  <button onclick="toggleMenu()" class="text-2xl">
    ☰
  </button>

  <!-- MENU -->
  <div id="menu" class="hidden absolute right-4 top-14 bg-white shadow-lg rounded-xl w-44 p-2 z-50 ui-font">

    <a href="index.html" class="block px-3 py-2 hover:bg-gray-100 rounded-lg">🏠 Home</a>
    <a href="topup.html" class="block px-3 py-2 hover:bg-gray-100 rounded-lg">💰 Top Up</a>
    <a href="riwayat.html" class="block px-3 py-2 hover:bg-gray-100 rounded-lg">📄 Riwayat</a>
    <a href="kontak.html" class="block px-3 py-2 hover:bg-gray-100 rounded-lg">📞 Kontak</a>

  </div>

</div>

<!-- SLIDER -->
<div class="overflow-hidden">
  <div id="slider" class="flex transition-all duration-500">
    <img src="https://i.supaimg.com/23b223c0-a5cc-4eb9-a50a-df79dbf49f6a/8ae8e357-976c-4a6e-a8d9-5c8a48e44aa6.png" class="w-full flex-shrink-0">
    <img src="banner2.jpg" class="w-full flex-shrink-0">
    <img src="banner3.jpg" class="w-full flex-shrink-0">
  </div>
</div>

<!-- CATEGORY -->
<div class="flex gap-3 px-4 py-3 overflow-x-auto ui-font">

  <button onclick="location.href='populer.html'" class="px-4 py-2 bg-blue-100 text-blue-600 rounded-full whitespace-nowrap">
    🔥 Populer
  </button>

  <button onclick="location.href='mobile.html'" class="px-4 py-2 bg-white rounded-full whitespace-nowrap">
     Mobile Game
  </button>
  
  <button onclick="location.href='voucher.html'" class="px-4 py-2 bg-white rounded-full whitespace-nowrap">
     Voucher
  </button>

</div>

<!-- TITLE -->
<h2 class="px-4 text-lg ui-font font-semibold">Populer</h2>

<!-- GAME GRID -->
<div class="grid grid-cols-3 gap-4 p-4">

  <a href="list.html"><div class="bg-white rounded-xl overflow-hidden shadow"><img src="ml.jpg" class="w-full aspect-[3/4] object-cover"></div></a>
  <a href="ff.html"><div class="bg-white rounded-xl overflow-hidden shadow"><img src="ff.jpg" class="w-full aspect-[3/4] object-cover"></div></a>
  <a href="ffmax.html"><div class="bg-white rounded-xl overflow-hidden shadow"><img src="ffmax.jpg" class="w-full aspect-[3/4] object-cover"></div></a>
  <a href="roblox.html"><div class="bg-white rounded-xl overflow-hidden shadow"><img src="roblox.jpg" class="w-full aspect-[3/4] object-cover"></div></a>
  <a href="steam.html"><div class="bg-white rounded-xl overflow-hidden shadow"><img src="steam.jpg" class="w-full aspect-[3/4] object-cover"></div></a>
  <a href="valorant.html"><div class="bg-white rounded-xl overflow-hidden shadow"><img src="valorant.jpg" class="w-full aspect-[3/4] object-cover"></div></a>
  <a href="genshin.html"><div class="bg-white rounded-xl overflow-hidden shadow"><img src="genshin.jpg" class="w-full aspect-[3/4] object-cover"></div></a>
  <a href="pubg.html"><div class="bg-white rounded-xl overflow-hidden shadow"><img src="pubg.jpg" class="w-full aspect-[3/4] object-cover"></div></a>
  <a href="codm.html"><div class="bg-white rounded-xl overflow-hidden shadow"><img src="codm.jpg" class="w-full aspect-[3/4] object-cover"></div></a>

</div>

<!-- SCRIPT -->
<script>
// SLIDER
let index = 0;
const slider = document.getElementById("slider");

setInterval(() => {
  index++;
  if(index > 2) index = 0;
  slider.style.transform = `translateX(-${index * 100}%)`;
}, 3000);

// NAVBAR
function toggleMenu() {
  const menu = document.getElementById("menu");
  menu.classList.toggle("hidden");
}
</script>

</body>
</html>
