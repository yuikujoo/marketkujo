<style>
.overflow-x-auto::-webkit-scrollbar { display:none; }
.no-scrollbar::-webkit-scrollbar { display: none; }

body { background-color: #050505; color: #f0f0f0; overflow-x: hidden; width: 100%; }
.bg-dark-card { background: rgba(18, 18, 18, 0.98); }

/* LOGO ANIMASI WHITE */
.logo-font {
  font-family:'Squada One',sans-serif;
  letter-spacing:1px;
  display: flex;
  gap: 1px;
}
.logo-font span {
  display: inline-block;
  opacity: 0;
  transform: translateY(15px);
  animation: letterAnim 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  background: #ffffff; 
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
@keyframes letterAnim { to { opacity: 1; transform: translateY(0); } }

/* DELAY PER HURUF */
.logo-font span:nth-child(1){animation-delay:0.1s;}.logo-font span:nth-child(2){animation-delay:0.15s;}
.logo-font span:nth-child(3){animation-delay:0.2s;}.logo-font span:nth-child(4){animation-delay:0.25s;}
.logo-font span:nth-child(5){animation-delay:0.3s;}.logo-font span:nth-child(6){animation-delay:0.35s;}
.logo-font span:nth-child(7){animation-delay:0.4s;}.logo-font span:nth-child(8){animation-delay:0.45s;}
.logo-font span:nth-child(9){animation-delay:0.5s;}.logo-font span:nth-child(10){animation-delay:0.55s;}
.logo-font span:nth-child(11){animation-delay:0.6s;}

.ui-font { font-family:'Poppins',sans-serif; }

/* SLIDER 3D MOBILE CENTER */
.slider-container {
  position: relative;
  width: 100vw;
  height: 180px;
  display: flex;
  align-items: center;
  overflow: visible;
}

.slide-wrapper {
  display: flex;
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  will-change: transform;
}

.banner-card {
  min-width: 75vw;
  height: 140px;
  margin: 0 10px;
  border-radius: 16px;
  overflow: hidden;
  transition: all 0.5s ease;
  transform: scale(0.8);
  opacity: 0.4;
}

.banner-card.active {
  transform: scale(1.05);
  opacity: 1;
  box-shadow: 0 8px 25px rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.banner-card img { width: 100%; height: 100%; object-fit: cover; }

/* CARD HOVER */
.card-hover { 
    transition: all .4s cubic-bezier(0.165, 0.84, 0.44, 1); 
    border: 1px solid rgba(255, 255, 255, 0.05);
}
.card-hover:hover { 
    transform: translateY(-5px); 
    border-color: rgba(255, 255, 255, 0.4);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-item { animation: slideUp 0.5s ease forwards; }

/* BADGE NYALA */
.badge {
  position: relative;
  background: linear-gradient(135deg, #bf953f, #fcf6ba, #aa771c);
  background-size: 200% 200%;
  animation: gradientMove 3s linear infinite;
  box-shadow: 0 0 12px rgba(191, 149, 63, 0.7);
  overflow: hidden;
  color: #000;
  font-weight: 800;
  border-radius: 4px;
}
.badge::after {
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.8),transparent);
  animation: shine 2.5s infinite;
}
@keyframes shine { 0% { left:-100%; } 50% { left:100%; } 100% { left:100%; } }
@keyframes gradientMove { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }

.category-btn {
  background: #151515;
  color: #777;
  font-size: 11px;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1px solid #222;
  white-space: nowrap;
}
.active-cat { background: #ffffff; color: #000; border-color: #ffffff; }

.overlay { background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 70%, transparent 100%); }
</style>
</head>

<script>
// 3D SLIDER LOGIC
let currentPos = 0;
const slides = document.querySelectorAll('.banner-card');
const wrapper = document.getElementById('slide-wrapper');

function moveSlider() {
  slides.forEach((s, i) => {
    s.classList.remove('active');
    if (i === currentPos) s.classList.add('active');
  });

  const cardWidth = window.innerWidth * 0.75; 
  const margin = 20; 
  const offset = (window.innerWidth / 2) - (cardWidth / 2) - (currentPos * (cardWidth + margin)) - 10;

  wrapper.style.transform = `translateX(${offset}px)`;
}

setInterval(() => {
  currentPos = (currentPos + 1) % slides.length;
  moveSlider();
}, 4000);

window.addEventListener('resize', moveSlider);
moveSlider();

// MENU LOGIC
function toggleMenu() {
  document.getElementById("menu").classList.toggle("hidden");
}

// FILTER LOGIC
function filterItems(category, el) {
  document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active-cat'));
  el.classList.add('active-cat');

  const titleText = document.getElementById("title-text");
  const items = document.querySelectorAll('.game-item');
  let count = 0;

  items.forEach(item => {
    item.classList.remove('animate-item');
    void item.offsetWidth;
    item.classList.add('animate-item');

    if (category === 'all') {
      titleText.innerText = "Populer";
      if (count < 6) {
        item.style.display = 'block';
        count++;
      } else {
        item.style.display = 'none';
      }
    } else {
      titleText.innerText = category.toUpperCase();
      if (item.getAttribute('data-category') === category) {
        item.style.display = 'block';
      } else {
        item.style.display = 'none';
      }
    }
  });
}

function goAccountGame(){ window.location.href = "account-game.html"; }

window.onclick = (e) => {
  const menu = document.getElementById('menu');
  if (menu && !menu.contains(e.target) && !e.target.innerText.includes('☰')) menu.classList.add('hidden');
};
</script>
