<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kujo Market - Premium Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Squada+One&family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">

<style>
  ::-webkit-scrollbar { display: none; }
  body { background-color: #050505; color: #f0f0f0; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
  .bg-dark-card { background: rgba(18, 18, 18, 0.98); }
  .font-logo { font-family: 'Squada One', sans-serif; letter-spacing: 1px; }
  
  /* --- GIMIK EMAS --- */
  .gold-text { 
    background: linear-gradient(135deg, #bf953f, #fcf6ba, #aa771c, #fcf6ba, #bf953f); 
    background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
    animation: shineText 3s linear infinite; 
  }
  @keyframes shineText { to { background-position: 200% center; } }

  /* --- KARTU & BORDER PUTAR --- */
  .card-premium { 
    position: relative; background: #0f0f0f; border-radius: 1rem; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1; transition: transform 0.2s ease;
  }
  .card-premium:not(.is-sold-out):active { transform: scale(0.95); }
  .card-premium::before {
    content: ''; position: absolute; width: 150%; height: 150%;
    background-image: conic-gradient(transparent, transparent, transparent, #bf953f);
    animation: rotateBorder 4s linear infinite; z-index: -2;
  }
  .card-premium::after { content: ''; position: absolute; inset: 2px; background: #111; border-radius: 0.9rem; z-index: -1; }
  @keyframes rotateBorder { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  /* --- BADGE DENYUT --- */
  .gold-badge { 
    background: linear-gradient(135deg, #bf953f, #fcf6ba, #aa771c); color: #000; 
    font-weight: 800; font-size: 9px; padding: 2px 6px; border-radius: 4px; 
    animation: pulseBadge 1.5s infinite alternate; 
  }
  @keyframes pulseBadge { from { transform: scale(1); } to { transform: scale(1.1); } }

  /* --- SISTEM SOLD OUT (GIMIK ABU-ABU) --- */
  .is-sold-out { filter: grayscale(1) !important; opacity: 0.5 !important; cursor: not-allowed !important; pointer-events: none !important; }
  .is-sold-out::before { background-image: conic-gradient(transparent, transparent, transparent, #444) !important; }
  .is-sold-out .gold-badge { background: #333 !important; color: #888 !important; animation: none !important; box-shadow: none !important; }
  .is-sold-out .gold-text { background: #666 !important; -webkit-text-fill-color: #666 !important; }

  /* --- ANIMASI LAINNYA --- */
  .entry-anim { opacity: 0; animation: fadeInUp 0.6s ease forwards; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .animate-marquee { animation: marquee 15s linear infinite; display: flex; width: max-content; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
</style>
</head>
<body>

<div class="bg-dark-card p-4 px-6 flex justify-between items-center sticky top-0 z-50 border-b border-white/5 shadow-2xl">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-md bg-[#bf953f] flex items-center justify-center font-bold text-black">K</div>
    <h1 class="text-xl font-logo gold-text">KUJO MARKET</h1>
  </div>
  <button onclick="toggleMenu()" class="text-2xl text-white outline-none">☰</button>
  <div id="menu" class="hidden absolute right-4 top-16 bg-[#111]/95 border border-white/10 rounded-2xl w-44 p-2 shadow-3xl z-50 backdrop-blur-xl">
    <ul class="space-y-1 text-sm text-white">
      <li onclick="location.href='index.html'" class="p-3 rounded-xl hover:bg-white/5">🏠 Home</li>
      <li onclick="location.href='topup.html'" class="p-3 rounded-xl hover:bg-white/5">💰 Top Up</li>
    </ul>
  </div>
</div>

<div class="bg-white/5 border-y border-white/5 py-1 overflow-hidden">
  <div class="whitespace-nowrap flex gap-10 animate-marquee">
    <span class="text-[9px] font-bold gold-text uppercase">⚡ FLASH SALE PREMIUM ITEM - KUJO MARKET ⚡</span>
    <span class="text-[9px] font-bold gold-text uppercase">⚡ FLASH SALE PREMIUM ITEM - KUJO MARKET ⚡</span>
  </div>
</div>

<div id="product-list" class="p-4 grid grid-cols-2 gap-4"></div>

<script src="produk.js"></script>

<script>
  function renderMarket() {
    const list = document.getElementById('product-list');
    
    // Fungsi cek kata 'sold' (Nama atau Badge)
    const cekSold = (item) => {
      return item.nama.toLowerCase().includes("sold") || item.badge.toLowerCase().includes("sold");
    };

    // Sorting Otomatis: Yang Sold Out dipaksa ke bawah
    const sortedData = [...dataProduk].sort((a, b) => cekSold(a) - cekSold(b));

    list.innerHTML = sortedData.map((item, index) => {
      const isSold = cekSold(item);
      
      return `
        <div class="card-premium entry-anim ${isSold ? 'is-sold-out' : 'cursor-pointer'}" 
             style="animation-delay: ${index * 0.1}s"
             ${isSold ? '' : `onclick="location.href='${item.link}'"`}>
          <div class="p-1 w-full h-full relative z-10 text-center">
            <div class="absolute top-2 left-2 z-20 gold-badge">${item.badge}</div>
            <img src="${item.foto}" class="w-full aspect-[3/4] object-cover rounded-t-xl">
            <div class="p-3">
              <p class="text-[11px] font-bold ${isSold ? 'text-gray-500' : 'text-white'} truncate">${item.nama}</p>
              <p class="text-[9px] text-red-500/80 line-through">${item.coret}</p>
              <p class="text-xs ${isSold ? 'text-gray-600 font-bold' : 'gold-text font-black scale-110'}">
                ${isSold ? 'HABIS' : item.harga}
              </p>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  window.onload = renderMarket;
  function toggleMenu() { document.getElementById("menu").classList.toggle("hidden"); }
</script>
</body>
</html>
